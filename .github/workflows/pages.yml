name: Publish board to GitHub Pages

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-flash-latest
      SUMMARY_LANGUAGE: Korean
      BOARD_MAX_NEW_SUMMARIES: "30"
    steps:
      - uses: actions/checkout@v5

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static UI
        working-directory: frontend
        run: |
          npm ci
          npm run build:static

      - name: Restore board history from live site
        run: |
          mkdir -p data
          curl -fsSL "${{ steps.pages.outputs.base_url }}/api/history.json" -o data/board_history.json \
            || echo "No published history yet; starting fresh."

      - name: Fetch feeds and score with Gemini
        run: python -m web_app.build_static frontend/dist

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
